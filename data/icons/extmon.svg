<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1c232e"/>
      <stop offset="1" stop-color="#10141b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3547"/>
      <stop offset="1" stop-color="#1e2633"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd8c9"/>
      <stop offset="0.55" stop-color="#6f8bf5"/>
      <stop offset="1" stop-color="#b46cf5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- monitor -->
  <rect x="86" y="92" width="340" height="236" rx="30" fill="url(#screen)" stroke="#4a5a72" stroke-width="10"/>
  <rect x="242" y="328" width="28" height="36" rx="6" fill="#4a5a72"/>
  <rect x="192" y="362" width="128" height="20" rx="10" fill="#4a5a72"/>

  <!-- gamma S-curve -->
  <path d="M 130 290 C 228 290, 284 134, 382 134"
        fill="none" stroke="url(#curve)" stroke-width="32" stroke-linecap="round"/>

  <!-- knob on the curve -->
  <circle cx="256" cy="212" r="22" fill="#f4f7fb" stroke="#10141b" stroke-width="8"/>

  <!-- channel dots -->
  <circle cx="150" cy="150" r="12" fill="#3fd8c9"/>
  <circle cx="190" cy="136" r="12" fill="#6f8bf5"/>
  <circle cx="230" cy="126" r="12" fill="#b46cf5"/>
</svg>
